name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Deploy to server
        run: |
          cd /var/www/html/streamhive
          git pull origin main